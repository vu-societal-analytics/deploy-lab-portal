# The test apps of the dev setup (see compose.yml): each answers with the headers it received from Caddy.
# Edit freely: the portal reloads this file within seconds.
services:
  notes:
    name: Notes
    description: For lab members, with an API path for scripts
    upstream: app-notes:8000
    mfa: optional
    api_bypass: [/api/*]
  secret:
    name: Secret
    description: Only with a second factor
    upstream: app-secret:8000
    mfa: required
  admintool:
    name: Admin tool
    description: Only for lab admins
    upstream: app-notes:8000
    access: admins
    mfa: required
