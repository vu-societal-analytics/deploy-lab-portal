# Example services, to see the overview and the access rules. In development mode there is no Caddy:
# the links to the services don't open anything. Edit freely: the portal reloads this file within seconds.
services:
  notes:
    name: Notes
    description: For lab members, with an API path for scripts
    upstream: 127.0.0.1:8001
    mfa: optional
    api_bypass: [/api/*]
  secret:
    name: Secret
    description: Only with a second factor
    upstream: 127.0.0.1:8002
    mfa: required
  admintool:
    name: Admin tool
    description: Only for lab admins
    upstream: 127.0.0.1:8003
    access: admins
    mfa: required
