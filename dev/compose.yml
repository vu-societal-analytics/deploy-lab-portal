# The dev setup of the lab portal: everything except the portal itself, which runs from the source
# code on this computer (./dev/start.sh). Not for a server: test users, a known secret, no real email.
name: lab-portal-dev

x-echo: &echo
  image: python:3.13-alpine
  # Answers every request with the path and the identity headers Caddy passed on
  command:
    - python
    - -c
    - |
      import http.server, json
      class H(http.server.BaseHTTPRequestHandler):
          def do_GET(self):
              body = json.dumps({'path': self.path, 'user': self.headers.get('X-Auth-Request-User'), 'email': self.headers.get('X-Auth-Request-Email')}, indent=2).encode()
              self.send_response(200); self.send_header('Content-Type', 'application/json'); self.end_headers(); self.wfile.write(body)
          do_POST = do_GET
          def log_message(self, *a): pass
      http.server.ThreadingHTTPServer(('0.0.0.0', 8000), H).serve_forever()

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 60

  mail:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  caddy:
    image: caddy:2.10.2-alpine
    # The Caddyfile is written by the portal (from config/services.yml); Caddy reloads it on change
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    ports: ["127.0.0.1:80:80", "127.0.0.1:443:443"]
    volumes:
      - ./.work/caddy:/etc/caddy:ro
      - caddy-data:/data
    # The portal runs on this computer, outside Docker (on Linux this name needs to be added)
    extra_hosts: ["host.docker.internal:host-gateway"]

  app-notes: *echo
  app-secret: *echo

volumes:
  caddy-data:
