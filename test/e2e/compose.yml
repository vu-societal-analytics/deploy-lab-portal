# The end-to-end test: Keycloak (a minimal realm), a mail catcher, the portal and Caddy, all on the
# host's network (lab.test on 127.0.0.1). Run with ./run.sh, not on a server that uses ports 80, 443,
# 1025, 3000, 8025 or 8080.
name: lab-portal-e2e

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    network_mode: host
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-e2e
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 40

  mail:
    image: axllent/mailpit:v1.27
    network_mode: host

  portal:
    build: ../../portal
    image: lab-portal-e2e-portal
    network_mode: host
    env_file: portal.env
    volumes:
      - ./.work/config:/config:ro
      - ./.work/caddy:/caddy
      - ./.work/data:/data
      - ./.work/backups:/backups
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 2s
      retries: 30

  caddy:
    image: caddy:2.10.2-alpine
    network_mode: host
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    volumes:
      - ./.work/caddy:/etc/caddy:ro
    depends_on:
      portal:
        condition: service_healthy
