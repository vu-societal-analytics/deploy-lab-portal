services:
  notes:
    name: Notes
    description: For members, with an API
    upstream: 127.0.0.1:9001
    mfa: optional
    api_bypass: [/api/*]
  secret:
    name: Secret
    description: Needs a second factor
    upstream: 127.0.0.1:9002
    mfa: required
  admintool:
    name: Admin tool
    upstream: 127.0.0.1:9003
    access: admins
    mfa: required
  open:
    name: Open
    upstream: 127.0.0.1:9003
    access: public
  brief:
    name: Brief
    description: Signs out after 30 seconds without use (a test of per-app session limits)
    upstream: 127.0.0.1:9003
    mfa: optional
    session_idle: 30s
